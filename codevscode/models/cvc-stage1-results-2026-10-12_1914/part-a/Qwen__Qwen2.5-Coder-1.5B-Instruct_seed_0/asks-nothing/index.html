<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team notes</title>
</head>
<body>
  <main>
    <h1>Team notes</h1>
    <form id="signupForm">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required><br><br>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required minlength="8"><br><br>
      <button type="submit">Sign up</button>
    </form>
    <form id="loginForm">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required><br><br>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required><br><br>
      <button type="submit">Login</button>
    </form>
    <ul id="notesList"></ul>
    <form id="createNoteForm">
      <label for="title">Title:</label>
      <input type="text" id="title" name="title" required><br><br>
      <label for="body">Body:</label>
      <textarea id="body" name="body"></textarea><br><br>
      <button type="submit">Create note</button>
    </form>
    <form id="readNoteForm">
      <label for="noteId">Note ID:</label>
      <input type="number" id="noteId" name="noteId" required><br><br>
      <button type="submit">Read note</button>
    </form>
    <form id="updateNoteForm">
      <label for="noteId">Note ID:</label>
      <input type="number" id="noteId" name="noteId" required><br><br>
      <label for="title">Title:</label>
      <input type="text" id="title" name="title" required><br><br>
      <label for="body">Body:</label>
      <textarea id="body" name="body"></textarea><br><br>
      <button type="submit">Update note</button>
    </form>
    <form id="deleteNoteForm">
      <label for="noteId">Note ID:</label>
      <input type="number" id="noteId" name="noteId" required><br><br>
      <button type="submit">Delete note</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
