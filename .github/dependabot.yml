# Dependency updates arrive as pull requests, and those pull requests run the same five test
# workflows as anything else - so an update that breaks a suite announces itself instead of
# being noticed months later.
#
# Everything here is grouped into one pull request per project. The failure mode this guards
# against is not missing an update; it is twenty open pull requests nobody reads, which looks
# worse on a public repository than being a version behind.
#
# `versioning-strategy: increase-if-necessary` is the important line. Every Python dependency
# here is a floor (`flask>=3.0`), so pip already installs the newest release that satisfies
# it: raising the floor to >=3.1.3 changes nothing that runs, and the default strategy opens a
# pull request for each one anyway. The first scan produced ten of them. Now a pip pull
# request only appears when the floor genuinely has to move.
#
# The quiet projects report monthly. Base images and actions stay weekly, because those are
# the ones where sitting still has a cost: a stale base image is unpatched, not just old.
#
# Dependabot's pull requests need no secrets, which is why the test workflows still pass on
# them: every job here runs local code and a service container, and none of them touch a
# hosted model.

version: 2
updates:
  # ---------------------------------------------------------------- Python
  - package-ecosystem: pip
    versioning-strategy: increase-if-necessary
    directory: /herder
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      # Everything in one pull request, majors included. Volume is the thing being
      # controlled here; a grouped pull request that fails its checks is still one thing
      # to read, and the checks say which member broke it.
      herder-updates:
        patterns: ["*"]

  - package-ecosystem: pip
    versioning-strategy: increase-if-necessary
    directory: /mailman
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      mailman-updates:
        patterns: ["*"]

  - package-ecosystem: pip
    versioning-strategy: increase-if-necessary
    directory: /fallacysuspect
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      fallacysuspect-updates:
        patterns: ["*"]

  - package-ecosystem: pip
    versioning-strategy: increase-if-necessary
    directory: /whereyago/backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      whereyago-backend-updates:
        patterns: ["*"]

  - package-ecosystem: pip
    versioning-strategy: increase-if-necessary
    directory: /evaluaters/eval-harness
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      eval-harness-updates:
        patterns: ["*"]

  - package-ecosystem: pip
    versioning-strategy: increase-if-necessary
    directory: /evaluaters/triage-agent
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      triage-agent-updates:
        patterns: ["*"]

  # ---------------------------------------------------------------- Base images
  # A base image goes stale quietly: python:3.13-slim keeps working while the security
  # patches pile up behind it.
  #
  # Majors are ignored on purpose. **No test here covers a base image**: CI installs Python
  # with setup-python, so a jump to python:3.14-slim would pass every check and only break
  # at deploy time - and on a CPU-only box that is exactly where a missing torch wheel for a
  # brand-new Python turns up. Moving a major is a decision to make deliberately, with the
  # image built locally first, not a pull request to wave through.
  - package-ecosystem: docker
    directory: /herder
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /mailman
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /fallacysuspect
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /whereyago/backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------- The mobile app
  # Expo pulls a large tree, so this one is capped hard and grouped whole. trail is not
  # here: it has no dependencies at all, which is the point of it.
  - package-ecosystem: npm
    directory: /whereyago/mobile
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      mobile-updates:
        patterns: ["*"]

  # ---------------------------------------------------------------- The workflows themselves
  # actions/checkout and friends. This is also how the Node 20 deprecation notice in the
  # run logs eventually goes away.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions-updates:
        patterns: ["*"]
