# codevscode's two suites: the Node one (the shared test runner, the validator, and every
# challenge in the repo validated), and the Python one (the server) against a real Postgres.
#
# Validating the challenges in CI matters as much as the unit tests: a change to a reference
# app that silently stops a planted bug from being caught would otherwise only show up when
# someone played that challenge.

name: codevscode

on:
  push:
    branches: [main]
    paths:
      - codevscode/**
      - .github/workflows/test-codevscode.yml
  # No path filter on pull requests, deliberately, as in the other suites: a required status
  # check that never runs leaves the pull request waiting for it forever.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    # The status check's name in branch protection. Unique per workflow.
    name: codevscode challenges and runner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codevscode
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: codevscode/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate every challenge
        run: |
          for dir in challenges/*/; do
            node tools/validate.mjs "$dir"
          done

  python:
    name: codevscode server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codevscode

    services:
      db:
        # The same image as docker-compose.yml, from Google's Docker Hub mirror: runners pull
        # anonymously from shared addresses and Docker Hub rate-limits them.
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: codevscode
          POSTGRES_PASSWORD: codevscode
          POSTGRES_DB: codevscode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codevscode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # 5432 here, not the 5435 of a local run: on the runner nothing else wants the port.
      DATABASE_URL: postgresql+psycopg://codevscode:codevscode@localhost:5432/codevscode
      REQUIRE_DB: "1"
      # The harness tests skip without Node on a laptop; here a skip would hide a failure.
      REQUIRE_NODE: "1"
      # The sandbox tests skip without Docker on a laptop; here a skip would hide a failure.
      REQUIRE_DOCKER: "1"
      # The client's sentence model, cached between runs (about 90 MB from Hugging Face).
      CLIENT_MODEL_CACHE: /home/runner/.cache/codevscode-models

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: codevscode/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # The model harness (codevscode/harness.py) calls the game's JavaScript through Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: codevscode/package-lock.json

      - name: Install Node packages
        run: npm ci

      - name: Cache the sentence model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/codevscode-models
          key: sentence-model-all-MiniLM-L6-v2

      # The judge's job image: the sandbox tests start real containers from it.
      - name: Build the judge image
        run: docker build -t codevscode-judge -f judge/Dockerfile .

      # The schema is the migrations, so running them here tests them as well.
      - name: Migrate
        run: alembic upgrade head

      - name: Test
        # -rs lists anything skipped, so a skip creeping in is visible in the log.
        run: python -m pytest -q -rs
