# The triage agent's typed GitHub tools. The tests stub the HTTP layer, so this job needs
# no token and makes no network call - which is the property being tested.

name: triage-agent

on:
  push:
    branches: [main]
    paths:
      - evaluaters/triage-agent/**
      - .github/workflows/test-triage-agent.yml
  # No path filter on pull requests, deliberately. A required status check that never
  # runs leaves the pull request waiting for it forever, so every suite runs on every
  # pull request. Pushes stay filtered: a change to one project does not run the rest.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The status check's name in branch protection. Unique per workflow, or all five
    # appear as "test" and cannot be told apart.
    name: triage-agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluaters/triage-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evaluaters/triage-agent/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q
