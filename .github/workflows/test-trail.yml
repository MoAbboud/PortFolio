# trail's suite: 615 tests, including several that boot the page in a stubbed browser and
# draw frames. No database and no services.
#
# It does need the model packs. They are not in git, and without them five tests fail rather
# than skip - the library cannot be built, so the page never finishes starting. Reproduced by
# running the suite against a tracked-files-only checkout. So this job downloads the same
# release the site build uses, and the suite tests what a visitor actually gets.

name: trail

on:
  push:
    branches: [main]
    paths:
      - trail/**
      - .github/workflows/test-trail.yml
  # No path filter on pull requests, deliberately. A required status check that never
  # runs leaves the pull request waiting for it forever, so every suite runs on every
  # pull request. Pushes stay filtered: a change to one project does not run the rest.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The status check's name in branch protection. Unique per workflow, or all five
    # appear as "test" and cannot be told apart.
    name: trail tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trail
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the model packs
        # --skip-old-files: the JSON files git already has win over the archive's copies.
        run: |
          curl -fsSL -o trail-models.tar.gz \
            "https://github.com/${{ github.repository }}/releases/download/trail-models/trail-models.tar.gz"
          tar -xzf trail-models.tar.gz -C models --skip-old-files
          rm trail-models.tar.gz

      # No dependencies to install: the project has none, which is the point of it.
      - name: Test
        run: node --test
