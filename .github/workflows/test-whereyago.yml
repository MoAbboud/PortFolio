# whereyago's backend suite. It runs against an in-memory SQLite database with the database
# dependency overridden, by design, so this job needs no service container.

name: whereyago

on:
  push:
    branches: [main]
    paths:
      - whereyago/backend/**
      - .github/workflows/test-whereyago.yml
  # No path filter on pull requests, deliberately. A required status check that never
  # runs leaves the pull request waiting for it forever, so every suite runs on every
  # pull request. Pushes stay filtered: a change to one project does not run the rest.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The status check's name in branch protection. Unique per workflow, or all five
    # appear as "test" and cannot be told apart.
    name: whereyago tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whereyago/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: whereyago/backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q
